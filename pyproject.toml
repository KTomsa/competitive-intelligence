[project]
name = "competitive-intelligence"
version = "1.0.0rc1"
description = "Traceable Czech electricity marketing claim audits with bounded evidence agents"
readme = "README.md"
authors = [
    { name = "KrystofT", email = "krystoftomsa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.13",
    "flask==3.1.3",
    "flask-wtf==1.3.0",
    "httpx>=0.28",
    "pydantic>=2.12",
    "python-dotenv>=1.2.4",
    "sqlalchemy[mssql-python]>=2.1",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[project.scripts]
fact-or-watt-fixture-audit = "competitive_intelligence.worker:fixture_main"
fact-or-watt-worker = "competitive_intelligence.worker:main"
fact-or-watt-evaluate = "competitive_intelligence.evaluation:main"
fact-or-watt-check-preview = "competitive_intelligence.release:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["azure: opt-in tests against a separate Azure SQL test database"]
