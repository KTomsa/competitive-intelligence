[project]
name = "competitive-intelligence"
version = "0.1.0"
description = "Fact or Watt: ověření marketingových tvrzení dodavatelů elektřiny proti datům ERÚ a OTE"
readme = "README.md"
authors = [
    { name = "KrystofT", email = "krystoftomsa@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask==3.1.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
