{% elif name == 'activity' %}<path d="M3 12h4l3-8 4 16 3-8h4"/>

{% elif name == 'leaf' %}<path d="M20 3c-1 4 3 12-5 16-5 2-10-1-10-6C5 5 15 7 20 3ZM4 21l11-10"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'chevron' %}<path d="m8 10 4 4 4-4"/>
{% elif name == 'globe' %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a19 19 0 0 1 0 18 19 19 0 0 1 0-18Z"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>

{% elif name == 'bolt' %}<path d="m13 2-9 12h7l-1 8 10-13h-8z"/>
{% endif %}
</svg>
{%- endmacro %}
