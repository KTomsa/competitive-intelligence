<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fact or Watt{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="{% block page %}{% endblock %}"{% block body_attrs %}{% endblock %}>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ url_for('pages.index') }}">Fact or Watt</a>
      <p class="tagline">Ověřování marketingových tvrzení dodavatelů elektřiny proti dohledatelným datům</p>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap site-footer">
    <p>Interní nástroj Competitive Intelligence. Nejde o právní posouzení ani o žebříček dodavatelů.
       Chybějící důkaz není důkazem nepravdivosti.</p>
  </footer>
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
